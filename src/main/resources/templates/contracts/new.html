<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>契約登録</title>
</head>
<body>
  <h1>契約登録</h1>
  <div th:if="${error}" style="color:red;">
    <p th:text="${error}"></p>
  </div>
  <form action="/contracts" method="post">
    <label>顧客名<br>
      <select name="customerId">
        <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.name}"></option>
      </select>
    </label><br><br>
    <label>保険種別<br><input name="insuranceType" placeholder="例：自動車保険" required></label><br><br>
    <label>年齢<br><input type="number" name="age" min="18" placeholder="例：30" oninput="calcPremium()" th:value="${inputAge}"></label><br><br>
    <label>等級（1〜20）<br><input type="number" name="grade" min="1" max="20" placeholder="例：6" required oninput="calcPremium()"></label><br><br>
    <label>保険料（円）※自動計算されます<br><input type="number" name="premium" placeholder="自動計算" readonly></label><br><br>
    <label>開始日<br><input type="date" name="startDate" required></label><br><br>
    <label>満期日<br><input type="date" name="endDate" required></label><br><br>
    <script>
      function calcPremium() {
        const grade = parseInt(document.querySelector('[name="grade"]').value);
        const age = parseInt(document.querySelector('[name="age"]').value);
        let base = 0;
        if (age <= 20) base = 60000;
        else if (age <= 25) base = 45000;
        else if (age <= 29) base = 35000;
        else if (age <= 39) base = 28000;
        else if (age <= 49) base = 22000;
        else if (age <= 59) base = 20000;
        else if (age <= 69) base = 25000;
        else base = 30000;
        let discount = 0;
        if (grade >= 16) discount = 0.4;
        else if (grade >= 11) discount = 0.3;
        else if (grade >= 6) discount = 0.2;
        document.querySelector('[name="premium"]').value = Math.floor(base * (1 - discount));
      }
    </script>
    <button type="submit">登録する</button>
  </form>
  <br>
  <a href="/">戻る</a>
</body>
</html>
